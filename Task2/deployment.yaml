apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: app
        image: ghcr.io/kotenev/scaletestapp:latest
        ports:
        - containerPort: 8080
        name: http
        resources:
          requests:
            memory: "6Mi"
          limits:
            memory: "6Mi"